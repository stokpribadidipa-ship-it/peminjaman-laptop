<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laporan | Laptop School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = requireAuth(['admin']);
            if (!session) return;

            const stats = calculateDashboardStats();
            renderPageShell({
                role: 'admin',
                title: 'Laporan',
                subtitle: 'Statistik dan ringkasan',
                currentPage: 'laporan.html',
                content: `
            <div class="space-y-6">
              <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                ${buildStatCard('Laptop Tersedia', stats.tersedia, 'check-circle', 'green', 'Siap dipinjam')}
                ${buildStatCard('Laptop Dipinjam', stats.dipinjam, 'handshake', 'blue', 'Sedang digunakan')}
                ${buildStatCard('Laptop Maintenance', stats.maintenance, 'wrench', 'orange', 'Terlambat perawatan')}
                ${buildStatCard('Peminjaman Menunggu', stats.menunggu, 'clock3', 'yellow', 'Permintaan belum diolah')}
              </div>

              <div class="grid gap-6 xl:grid-cols-2">
                <div class="card rounded-2xl p-5">
                  <h3 class="text-lg font-bold text-slate-800 mb-4">Status laptop</h3>
                  <div class="space-y-3 text-sm">
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Tersedia</span>
                      <span class="font-bold text-green-600">${stats.tersedia}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Dipinjam</span>
                      <span class="font-bold text-blue-600">${stats.dipinjam}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Maintenance</span>
                      <span class="font-bold text-orange-600">${stats.maintenance}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Rusak</span>
                      <span class="font-bold text-red-600">${JSON.parse(localStorage.getItem(STORAGE_KEYS.laptops) || '[]').filter((item) => item.status === 'Rusak').length}</span>
                    </div>
                  </div>
                </div>

                <div class="card rounded-2xl p-5">
                  <h3 class="text-lg font-bold text-slate-800 mb-4">Ringkasan total</h3>
                  <div class="space-y-3 text-sm">
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Total siswa</span>
                      <span class="font-bold text-slate-800">${stats.totalSiswa}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Total peminjaman</span>
                      <span class="font-bold text-slate-800">${stats.totalPeminjaman}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Telah dikembalikan</span>
                      <span class="font-bold text-slate-800">${stats.selesai}</span>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 rounded-xl p-3">
                      <span class="font-medium text-slate-700">Sudah disetujui</span>
                      <span class="font-bold text-slate-800">${JSON.parse(localStorage.getItem(STORAGE_KEYS.peminjaman) || '[]').filter((item) => item.status === 'Disetujui' || item.status === 'Dipinjam').length}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `
            });

            lucide.createIcons();
        });
    </script>
</body>

</html>
