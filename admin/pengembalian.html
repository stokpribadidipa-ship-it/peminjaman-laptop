<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Pengembalian | Laptop School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = requireAuth(['admin']);
            if (!session) return;

            function loadTable() {
                const data = JSON.parse(localStorage.getItem(STORAGE_KEYS.pengembalian) || '[]');
                const peminjamanList = JSON.parse(localStorage.getItem(STORAGE_KEYS.peminjaman) || '[]');
                const search = document.getElementById('searchInput')?.value || '';

                const filtered = data.filter((item) => {
                    const peminjaman = peminjamanList.find((entry) => Number(entry.id) === Number(item.peminjamanId));
                    const siswa = getSiswaById(peminjaman?.siswaId);
                    const matchesSearch = !search || [item.id, siswa?.nama, item.kondisi, item.catatan].some((value) => String(value || '').toLowerCase().includes(search.toLowerCase()));
                    return matchesSearch;
                });

                document.getElementById('tableBody').innerHTML = filtered.map((item) => {
                    const peminjaman = peminjamanList.find((entry) => Number(entry.id) === Number(item.peminjamanId));
                    const siswa = getSiswaById(peminjaman?.siswaId);
                    return `
              <tr class="border-t border-slate-200 text-sm">
                <td class="py-3">${item.id}</td>
                <td class="py-3">${peminjaman?.kode || '-'}</td>
                <td class="py-3">${siswa?.nama || '-'}</td>
                <td class="py-3">${item.kondisi}</td>
                <td class="py-3">${formatDate(item.tanggal)}</td>
                <td class="py-3">${item.catatan}</td>
              </tr>
            `;
                }).join('');
            }

            renderPageShell({
                role: 'admin',
                title: 'Data Pengembalian',
                subtitle: 'Riwayat pengembalian laptop',
                currentPage: 'pengembalian.html',
                content: `
            <div class="space-y-4">
              <div class="card rounded-2xl p-4">
                <input id="searchInput" type="text" class="input-field md:w-72" placeholder="Cari pengembalian..." />
              </div>

              <div class="card rounded-2xl p-4">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr class="text-left text-sm text-slate-500">
                        <th class="pb-3">ID</th>
                        <th class="pb-3">Kode Peminjaman</th>
                        <th class="pb-3">Siswa</th>
                        <th class="pb-3">Kondisi</th>
                        <th class="pb-3">Tanggal</th>
                        <th class="pb-3">Catatan</th>
                      </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          `
            });

            document.getElementById('searchInput').addEventListener('input', loadTable);
            loadTable();
            lucide.createIcons();
        });
    </script>
</body>

</html>
