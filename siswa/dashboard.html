<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Siswa | Laptop School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = requireAuth(['siswa']);
            if (!session) return;

            const laptops = JSON.parse(localStorage.getItem(STORAGE_KEYS.laptops) || '[]');
            const peminjaman = JSON.parse(localStorage.getItem(STORAGE_KEYS.peminjaman) || '[]');
            const myRequests = peminjaman.filter((item) => Number(item.siswaId) === Number(session.userId));

            const stats = {
                tersedia: laptops.filter((item) => item.status === 'Tersedia').length,
                statusPengajuan: myRequests.filter((item) => item.status === 'Menunggu').length,
                aktif: myRequests.filter((item) => ['Disetujui', 'Dipinjam'].includes(item.status)).length,
                riwayat: myRequests.length
            };

            renderPageShell({
                role: 'siswa',
                title: 'Dashboard',
                subtitle: 'Ringkasan aktivitas siswa',
                currentPage: 'dashboard.html',
                content: `
            <div class="space-y-6">
              <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                ${buildStatCard('Laptop Tersedia', stats.tersedia, 'check-circle', 'green', 'Jumlah laptop siap dipinjam')}
                ${buildStatCard('Status Pengajuan', stats.statusPengajuan, 'clock3', 'yellow', 'Permintaan menunggu')}
                ${buildStatCard('Peminjaman Aktif', stats.aktif, 'clipboard-list', 'blue', 'Yang sudah disetujui')}
                ${buildStatCard('Riwayat', stats.riwayat, 'history', 'indigo', 'Total pengajuan Anda')}
              </div>
            </div>
          `
            });

            lucide.createIcons();
        });
    </script>
</body>

</html>
