<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Petugas | PinjamLaptop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = requireAuth(['petugas']);
            if (!session) return;

            const laptops = JSON.parse(localStorage.getItem(STORAGE_KEYS.laptops) || '[]');
            const peminjaman = JSON.parse(localStorage.getItem(STORAGE_KEYS.peminjaman) || '[]');

            const stats = {
                tersedia: laptops.filter((item) => item.status === 'Tersedia').length,
                dipinjam: laptops.filter((item) => item.status === 'Dipinjam').length,
                menunggu: peminjaman.filter((item) => item.status === 'Menunggu').length,
                aktif: peminjaman.filter((item) => ['Disetujui', 'Dipinjam'].includes(item.status)).length,
                hariIni: peminjaman.filter((item) => item.tanggalPinjam === getCurrentDate()).length
            };

            renderPageShell({
                role: 'petugas',
                title: 'Dashboard',
                subtitle: 'Ringkasan tugas petugas',
                currentPage: 'dashboard.html',
                content: `
            <div class="space-y-6">
              <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-5">
                ${buildStatCard('Laptop Tersedia', stats.tersedia, 'check-circle', 'green', 'Siap untuk dipinjam')}
                ${buildStatCard('Laptop Dipinjam', stats.dipinjam, 'handshake', 'blue', 'Sedang digunakan')}
                ${buildStatCard('Permintaan Menunggu', stats.menunggu, 'clock3', 'yellow', 'Perlu diproses')}
                ${buildStatCard('Pengembalian Hari Ini', stats.hariIni, 'package-check', 'slate', 'Belum terverifikasi')}
                ${buildStatCard('Peminjaman Aktif', stats.aktif, 'clipboard-list', 'indigo', 'Total aktif saat ini')}
              </div>
            </div>
          `
            });

            lucide.createIcons();
        });
    </script>
</body>

</html>
